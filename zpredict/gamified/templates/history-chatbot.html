{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat History - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/chathistorystyle.css' %}">
    <style>
        /* Game-inspired styles from gamifiedhome.html */
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-yellow: #ffff00;
            --dark-bg: #0a1a3b;
            --darker-bg: #050b1f;
            --card-bg: rgba(16, 18, 37, 0.8);
        }
        
        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 70%);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-attachment: fixed;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><rect x='0' y='0' width='4' height='4' fill='%2300f3ff'/><rect x='4' y='4' width='4' height='4' fill='%2300f3ff'/><rect x='8' y='8' width='4' height='4' fill='%2300f3ff'/><rect x='12' y='12' width='4' height='4' fill='%2300f3ff'/></svg>") 8 8, auto;
        }
        
        a, button, .filter-btn {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><rect x='0' y='0' width='16' height='16' fill='%23ff00ff'/><rect x='2' y='2' width='12' height='12' fill='%23000'/><rect x='4' y='4' width='8' height='8' fill='%23ff00ff'/></svg>") 8 8, pointer;
        }
        
        /* Pixelated elements */
        .pixel-border {
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 243, 255, 0.2);
            position: relative;
        }
        
        .pixel-border::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 2px solid var(--neon-pink);
            pointer-events: none;
        }
        
        /* 8-bit inspired text */
        .bit-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            letter-spacing: 1px;
        }
        
        .bit-text-sm {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        
        /* Futuristic text */
        .futuristic-text {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Enhanced page title */
        .page-title {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink), var(--neon-green));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            }
            to {
                text-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-pink), 0 0 40px var(--neon-pink);
            }
        }
        
        /* Enhanced particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-blue);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            opacity: 0.7;
        }
        
        .particle:nth-child(2n) {
            background: var(--neon-pink);
            animation-duration: 8s;
        }
        
        .particle:nth-child(3n) {
            background: var(--neon-green);
            animation-duration: 10s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10%, 90% {
                opacity: 0.7;
            }
            50% {
                transform: translateY(-10vh) rotate(180deg);
                opacity: 1;
            }
        }
        
        /* Game UI corners */
        .game-ui-corner {
            position: fixed;
            width: 30px;
            height: 30px;
            z-index: 1000;
        }
        
        .corner-top-left {
            top: 10px;
            left: 10px;
            border-top: 4px solid var(--neon-blue);
            border-left: 4px solid var(--neon-blue);
        }
        
        .corner-top-right {
            top: 10px;
            right: 10px;
            border-top: 4px solid var(--neon-pink);
            border-right: 4px solid var(--neon-pink);
        }
        
        .corner-bottom-left {
            bottom: 10px;
            left: 10px;
            border-bottom: 4px solid var(--neon-green);
            border-left: 4px solid var(--neon-green);
        }
        
        .corner-bottom-right {
            bottom: 10px;
            right: 10px;
            border-bottom: 4px solid var(--neon-yellow);
            border-right: 4px solid var(--neon-yellow);
        }
        
        /* Progress bar */
        .progress-bar {
            height: 5px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }
        
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            transition: width 0.3s ease;
        }
        
        /* Retro scanlines effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.03) 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 99;
            pointer-events: none;
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <!-- Progress bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <!-- Retro scanlines effect -->
    <div class="scanlines"></div>
    
    <!-- Game UI corners -->
    <div class="game-ui-corner corner-top-left"></div>
    <div class="game-ui-corner corner-top-right"></div>
    <div class="game-ui-corner corner-bottom-left"></div>
    <div class="game-ui-corner corner-bottom-right"></div>
    
    <!-- Include Gamified Navbar Component -->
    {% include 'gamified-navbar.html' %}
    
    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 6s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 8s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 10s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 12s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 14s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 16s;"></div>
    </div>
    <!-- Main Content -->
    <div class="main-container">
        <div class="page-header">
            <h1 class="page-title">Chat History</h1>
            <p class="page-subtitle">Review and manage your past conversations</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <img src="{% static 'images/search (1).png' %}" alt="Search" class="search-icon">
                <input type="text" class="search-input" id="searchInput" placeholder="Search chat history...">
            </div>
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="recent">Recent</button>
                <button class="filter-btn" data-filter="oldest">Oldest</button>
            </div>
        </div>

        <!-- Chat History List -->
        <div class="chat-history-list" id="chatHistoryList">
            <div class="loading">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <!-- Pagination will be added dynamically -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="{% static 'js/authentication.js' %}"></script>
    <script>
    window.DELETE_ICON_URL = "{% static 'images/delete.png' %}";
    window.EMPTY_ICON_URL = "{% static 'images/message.png' %}";
    </script>
   <script src="{% static 'js/chathistoryscript.js' %}"></script>
   <script>
        // Setup scroll progress bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                progressFill.style.width = scrolled + '%';
            }
        });
   </script>
</body>
</html>
